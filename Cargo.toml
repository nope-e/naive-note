[package]
name = "naive-note"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A local PDF handwriting application built with egui and Skia"
# Original project code; distribution with MuPDF must also comply with AGPLv3.
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
ciborium = "0.2.2"
egui = { version = "=0.37.0", features = ["default_fonts"] }
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }
egui-winit = { version = "=0.37.0", default-features = false }
egui_glow = "=0.37.0"
env_logger = "0.11"
glutin = { version = "=0.32.3", default-features = false, features = ["wgl"] }
glutin-winit = { version = "=0.5.0", default-features = false, features = ["wgl"] }
ink-stroke-modeler-rs = "=0.1.0"
log = "0.4"
mupdf = { version = "=0.8.0", default-features = false, features = ["base14-fonts", "system-fonts"] }
raw-window-handle = "0.6"
rfd = { version = "=0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# Preserve f64 settings exactly for save read-back validation.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
# Match an upstream Windows binary-cache artifact; GL alone is not published.
skia-safe = { version = "=0.157.0", default-features = false, features = ["binary-cache", "gl", "pdf"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
zstd = "0.14.3"
tablet-input-windows = "=1.0.0"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# Rasterize the app's vector artwork into the embedded multi-size Windows icon.
resvg = { version = "=0.45.1", default-features = false }
winresource = "=0.1.31"

# Skia's published Windows binaries use the release CRT. Match it in MuPDF,
# including cargo test, while keeping our own Rust code in the debug profile.
[profile.dev.package.mupdf-sys]
opt-level = 3
debug = false
